services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Point the app at the postgres service instead of localhost.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Google Gemini via the OpenAI-compatible API. GEMINI_API_KEY is a free
      # Google AI Studio key today; for a paid Vertex AI account later, also set
      # GEMINI_BASE_URL (and use a gcloud access token as the key) — no image rebuild.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your shell or .env file}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      # Must be a real model ID (see ai.google.dev/gemini-api/docs/models) — there is
      # no plain "gemini-3.1-flash"; the stable flash models are gemini-3.5-flash and
      # gemini-3.1-flash-lite.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      # Pictures are drawn by Pollinations AI. Draw-from-scratch (flux) is free and
      # keyless, but image-to-image EDITING (kontext) needs an account token — set
      # POLLINATIONS_API_KEY in your shell or .env file, otherwise editing fails with
      # 401 Unauthorized and the turn best-effort keeps the previous picture. These
      # MUST be listed here so Compose forwards them from .env INTO the container —
      # variables only referenced in .env are used for substitution, not passed in.
      POLLINATIONS_MODEL: ${POLLINATIONS_MODEL:-flux}
      POLLINATIONS_EDIT_MODEL: ${POLLINATIONS_EDIT_MODEL:-kontext}
      POLLINATIONS_BASE_URL: ${POLLINATIONS_BASE_URL:-https://image.pollinations.ai}
      POLLINATIONS_EDIT_BASE_URL: ${POLLINATIONS_EDIT_BASE_URL:-https://gen.pollinations.ai}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      # Persist the downloaded ONNX embedding model (all-MiniLM-L6-v2) across restarts
      # so it isn't re-fetched (~90 MB) on every cold start.
      SPRING_AI_EMBEDDING_TRANSFORMER_RESOURCE_CACHE_DIRECTORY: /models
    ports:
      - "8080:8080"
    volumes:
      - onnx-models:/models

volumes:
  postgres-data:
  onnx-models: