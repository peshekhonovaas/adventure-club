services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Point the app at the postgres service instead of localhost.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Google Gemini via the OpenAI-compatible API. GEMINI_API_KEY is a free
      # Google AI Studio key today; for a paid Vertex AI account later, also set
      # GEMINI_BASE_URL (and use a gcloud access token as the key) — no image rebuild.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your shell or .env file}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      # Must be a real model ID (see ai.google.dev/gemini-api/docs/models) — there is
      # no plain "gemini-3.1-flash"; the stable flash models are gemini-3.5-flash and
      # gemini-3.1-flash-lite.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      # Pictures are drawn by Cloudflare Workers AI (both draw-from-scratch and
      # image-to-image editing) via its REST API — needs a Cloudflare account id +
      # API token, set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in your shell or
      # .env file, otherwise illustration fails and the turn best-effort keeps the
      # previous picture. These MUST be listed here so Compose forwards them from .env
      # INTO the container — variables only referenced in .env are used for
      # substitution, not passed in.
      CLOUDFLARE_IMAGE_MODEL: ${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-2-klein-4b}
      CLOUDFLARE_IMAGE_EDIT_MODEL: ${CLOUDFLARE_IMAGE_EDIT_MODEL:-@cf/black-forest-labs/flux-2-klein-4b}
      CLOUDFLARE_BASE_URL: ${CLOUDFLARE_BASE_URL:-https://api.cloudflare.com/client/v4}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Persist the downloaded ONNX embedding model (all-MiniLM-L6-v2) across restarts
      # so it isn't re-fetched (~90 MB) on every cold start.
      SPRING_AI_EMBEDDING_TRANSFORMER_RESOURCE_CACHE_DIRECTORY: /models
    ports:
      - "8080:8080"
    volumes:
      - onnx-models:/models

volumes:
  postgres-data:
  onnx-models: