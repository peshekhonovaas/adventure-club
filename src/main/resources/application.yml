spring:
  application:
    name: adventure-club

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adventureclub}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5       # small pool — solo dev, low traffic

  jpa:
    hibernate:
      ddl-auto: validate         # Flyway owns the schema, Hibernate just validates
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    # Embeddings stay on the local ONNX model (free, offline); only chat goes to Gemini.
    # Image generation is NOT Spring AI's OpenAI ImageModel (that endpoint is
    # text-to-image only); we use a native Gemini client instead — see the
    # `adventureclub.images` block below — so disable the OpenAI image model here.
    model:
      embedding: transformers
      image: none

    # We talk to Google Gemini through its OpenAI-compatible API using Spring AI's
    # OpenAI client. Everything is env-driven, so switching from a FREE Google AI
    # Studio key to a PAID Vertex AI account later is only a change of env values —
    # no code change:
    #   Free  (Google AI Studio): the defaults below + GEMINI_API_KEY=<AI Studio key>
    #   Paid  (Vertex AI):        set GEMINI_BASE_URL to the Vertex OpenAI endpoint
    #                             (https://{LOCATION}-aiplatform.googleapis.com/v1beta1/
    #                              projects/{PROJECT}/locations/{LOCATION}/endpoints/openapi)
    #                             and GEMINI_API_KEY=<gcloud access token>.
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: ${GEMINI_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${GEMINI_MODEL:gemini-3.5-flash}   # multimodal — also "sees" uploaded drawings; must be a real ID (no plain "gemini-3.1-flash" exists — use -lite)
          max-tokens: 1024
          temperature: 0.8       # some creative variance for story generation

# The Illustrator grows ONE living picture of the adventure with Cloudflare
# Workers AI (https://developers.cloudflare.com/workers-ai/) via its REST API
# (base-url + /accounts/{account-id}/ai/run/{model}, i.e.
# POST https://api.cloudflare.com/client/v4/accounts/{account-id}/ai/run/{model}),
# authenticated with an API token sent as an `Authorization: Bearer
# <CLOUDFLARE_API_TOKEN>` header. Inputs travel as multipart/form-data (a `prompt`
# text part plus up to four binary `input_image_0..3` parts); the picture comes back
# as a base64 string in `result.image`. The FLUX.2 [klein] model unifies text-to-image
# generation AND image-to-image editing, so one model id serves both jobs:
#  - No base picture yet: draw from scratch text-to-image with `model`
#    (default @cf/black-forest-labs/flux-2-klein-4b).
#  - A base picture exists (a fresh upload, else the previous scene the client sends
#    back): paint the new beat ONTO it (image-to-image editing) with `edit-model`
#    (also default @cf/black-forest-labs/flux-2-klein-4b). The base picture(s) travel
#    as binary input_image_0.. multipart parts.
# Needs a Cloudflare account id + API token — set CLOUDFLARE_ACCOUNT_ID and
# CLOUDFLARE_API_TOKEN (see https://developers.cloudflare.com/workers-ai/).
# Env-driven so model/provider/key is a config change:
#   CLOUDFLARE_IMAGE_MODEL (default @cf/black-forest-labs/flux-2-klein-4b),
#   CLOUDFLARE_IMAGE_EDIT_MODEL (default @cf/black-forest-labs/flux-2-klein-4b),
#   CLOUDFLARE_BASE_URL (default https://api.cloudflare.com/client/v4),
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN.
# Set IMAGES_ENABLED=false to turn pictures off entirely.
adventureclub:
  images:
    enabled: ${IMAGES_ENABLED:true}
    base-url: ${CLOUDFLARE_BASE_URL:https://api.cloudflare.com/client/v4}
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    model: ${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-2-klein-4b}
    edit-model: ${CLOUDFLARE_IMAGE_EDIT_MODEL:@cf/black-forest-labs/flux-2-klein-4b}
    api-key: ${CLOUDFLARE_API_TOKEN:}

logging:
  level:
    com.adventureclub: DEBUG
    org.springframework.ai: INFO